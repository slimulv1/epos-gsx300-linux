# EPOS GSX 300 — static fail-closed null-sink anchor (MAIN instance)
#
# Install:  ~/.config/pipewire/pipewire.conf.d/40-epos-eq-virtualsink.conf
#
# This creates a static null-sink `epos-eq-input` in the MAIN pipewire graph.
# Apps that want EQ'd headphones target this sink. The pipewire-epos@eq
# instance captures `epos-eq-input.monitor`, applies the 9-band EQ, and plays
# to the real EPOS hardware sink.
#
# Why a STATIC anchor (not created by the eq instance):
#   - the sink must exist even while the eq instance is down/restarting, so
#     streams pinned to it stay pinned and go silent instead of WirePlumber
#     re-routing them to the default sink (which would leak game audio to A2+)
#   - fail-closed: instance dies  ->  audio vanishes into the null-sink  ->  silence
#
# NOTE: pipewire.conf.d is parsed ONLY at daemon startup (PipeWire 1.6.8), so
# this requires ONE main pipewire restart at install time. Runtime changes are
# handled by restarting the pipewire-epos@* instances — never main.

context.modules = [
    { name = libpipewire-module-adapter }
]

context.objects = [
    { factory = adapter
        args = {
            factory.name     = support.null-audio-sink
            node.name        = epos-eq-input
            node.description = "EPOS GSX 300 EQ (processed)"    
            media.class      = Audio/Sink
            audio.position   = [ FL FR ]
            audio.channels   = 2
            # Keep the anchor alive even with no links (fail-closed).
            node.always-process = true
            # Latency hint aligned with the epos-instance quantum (256/48000).
            node.latency = 256/48000
        }
    }
]