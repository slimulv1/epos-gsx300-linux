# EPOS GSX 300 Linux - PipeWire LADSPA_PATH drop-in
#
# Install: ~/.config/systemd/user/pipewire.service.d/ladspa.conf
# (user-level, no root required)
#
# Required for the noise gate feature: librnnoise_ladspa.so must be
# findable by PipeWire. The .so ships in werman/noise-suppression-for-voice
# releases (linux-rnnoise.zip -> ladspa/librnnoise_ladspa.so), installed at:
#   ~/.local/lib/ladspa/librnnoise_ladspa.so
[Service]
Environment=LADSPA_PATH=/home/magnus/.local/lib/ladspa:/usr/lib/ladspa:/usr/lib64/ladspa
