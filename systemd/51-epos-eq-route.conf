# EPOS GSX 300 — route EPOS-bound streams through the EQ null-sink (MAIN WirePlumber)
#
# Install:  ~/.config/wireplumber/wireplumber.conf.d/51-epos-eq-route.conf
# Requires: static null-sink `epos-eq-input` from 40-epos-eq-virtualsink.conf
#           (i.e. one main pipewire restart was performed at install time)
#
# Goal: playback streams that target the raw EPOS hardware sink (which would
# bypass the EQ DSP) are redirected to `epos-eq-input` so the entire headphone
# path goes through the pipewire-epos@eq instance. Streams pinned to the EQ
# path survive eq-instance restarts (fail-closed via the static anchor).
#
# STATUS: INACTIVE BY DEFAULT. Target-node redirection semantics must be
# verified live during the validation phase (WirePlumber versions differ on
# stream-target matching). Enable only after that probe passes; until then,
# users select "EPOS GSX 300 EQ (processed)" manually as the output device.
wireplumber.rules = [
    {
        matches = [
            {
                node.name = "alsa_output.usb-Sennheiser_EPOS_GSX_300_A003200202602692-00.analog-stereo"
            }
        ]
        actions = {
            update-props = {
                # Placeholder — fill during validation once the correct
                # redirection property for this WirePlumber version is probed,
                # e.g.  target.object = "epos-eq-input"
            }
        }
    }
]