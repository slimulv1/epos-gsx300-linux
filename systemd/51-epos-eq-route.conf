# EPOS GSX 300 - route EPOS-bound streams through the EQ null-sink (MAIN WirePlumber)
#
# Install:  ~/.config/wireplumber/wireplumber.conf.d/51-epos-eq-route.conf
# Requires: static null-sink `epos-eq-input` from 40-epos-eq-virtualsink.conf
#           (i.e. one main pipewire restart was performed at install time)
#
# Goal: playback streams that target the raw EPOS hardware sink (which would
# bypass the EQ DSP) are redirected to `epos-eq-input` so the entire headphone
# path goes through the pipewire-epos@eq instance.
#
# STATUS: INACTIVE BY DEFAULT - see the verification notes below. Do NOT simply
# fill in the action; the obvious approach is unsafe.
#
# VERIFIED ON THIS MACHINE (2026-09-24, WirePlumber 0.5.17, libpipewire 1.6.9)
# ------------------------------------------------------------------------
# 1. The 0.4-style schema in this file IS still honoured by WP 0.5.17. The
#    sibling 50-epos-gsx300-gaming.conf works, and the EPOS sink really does
#    carry its properties (audio.rate=48000, audio.format=S24_3LE,
#    node.latency=256/48000). So the syntax is fine and the blocker is
#    something else.
#
# 2. Setting `target.object = "epos-eq-input"` in the action block does
#    NOTHING. Measured: after installing such a rule and restarting
#    wireplumber, `wpctl status` showed zero streams targeting
#    epos-eq-input. The rule matches a DEVICE node, and a device sink's
#    `target.object` is not a redirect switch - it is only meaningful on
#    streams. The property was accepted and ignored.
#
# 3. Matching STREAMS instead (type = "Stream", target.node =~ hardware sink,
#    then change-props target.object = "epos-eq-input") is the textbook next
#    step and it is a TRAP: the pipewire-epos@eq instance's own output node
#    (epos-eq-output) publishes a stream that targets the SAME hardware sink.
#    Such a rule would capture that stream as well and feed it back into
#    epos-eq-input, producing a feedback loop and broken audio.
#
# SAFE OPTIONS (need a product decision + listening validation, not a guess)
# ------------------------------------------------------------------------
# a) Let the DAEMON manage the default sink: when eq.enabled is true call
#    `wpctl set-default <epos-eq-input>`, and restore the previous default when
#    it is turned off. This avoids the loop entirely because it changes device
#    selection rather than rewriting per-stream targets, and it keeps the
#    fail-closed anchor semantics.
# b) Keep manual selection: the user picks "EPOS GSX 300 EQ (processed)" in
#    the output-device list. The GUI sound test already opts in explicitly
#    (`pw-play --target epos-eq-input`), so EQ is verifiable today.
#
# Until one of those is implemented and validated with actual playback, this
# file ships with an empty action so it stays a no-op rather than breaking the
# user's audio.
wireplumber.rules = [
    {
        matches = [
            {
                # Regex, not the literal "..._A003200202602692-00..." serial,
                # so the rule survives device re-enumeration.
                node.name = "~^alsa_output\\.usb-Sennheiser_EPOS_GSX_300.*"
            }
        ]
        actions = {
            update-props = {
                # Intentionally empty.
                # Filling this with target.object = "epos-eq-input" was tried
                # and verified to have no effect (see note 2 above); doing it
                # per-stream instead risks the feedback loop in note 3.
            }
        }
    }
]
