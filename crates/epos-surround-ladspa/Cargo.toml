[package]
name = "epos-surround-ladspa"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "7.1 to binaural stereo renderer for the EPOS EQ chain, via LADSPA"

# A LADSPA plugin is loaded with dlopen by PipeWire, so it must be a C dynamic
# library. `crate-type` is therefore fixed, and the descriptor is exported under
# the name the LADSPA spec requires rather than through a Rust-visible symbol.
[lib]
crate-type = ["cdylib"]

# No dependencies, deliberately. This runs in a real-time audio thread: every
# crate added here is code that has to be audited for allocation on the audio
# path. The HRIRs are baked into the binary and the convolution is a direct-form
# FIR, so there is nothing left that could surprise us mid-callback.
[dependencies]

[profile.release]
opt-level = 3
lto = true
panic = "abort"
codegen-units = 1
# Native code generation, for the convolution loop.
#
# This is a plugin `dlopen`ed by PipeWire on the machine it runs on, not a
# binary shipped to other machines, so there is no portability reason to hold
# back: the FMA units the machine has are the ones the filter should use. It is
# opt-in rather than unconditional because a build for a different machine is
# still legitimate - a distribution package, a build host - and the fallback
# still fits in real time, it just leaves some of the machine unused.
#
# Measured, not assumed: the inner loop is a multiply-accumulate over 256 taps
# seven times per sample, and 7.2% of a core with generic codegen is well
# inside what the hardware can do.
target-cpu = "native"
