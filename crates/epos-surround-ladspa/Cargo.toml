[package]
name = "epos-surround-ladspa"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "7.1 to binaural stereo renderer for the EPOS EQ chain, via LADSPA"

# A LADSPA plugin is loaded with dlopen by PipeWire, so it must be a C dynamic
# library. `crate-type` is therefore fixed, and the descriptor is exported under
# the name the LADSPA spec requires rather than through a Rust-visible symbol.
[lib]
crate-type = ["cdylib"]

# No dependencies, deliberately. This runs in a real-time audio thread: every
# crate added here is code that has to be audited for allocation on the audio
# path. The HRIRs are baked into the binary and the convolution is a direct-form
# FIR, so there is nothing left that could surprise us mid-callback.
[dependencies]

# No [profile.release] table. Cargo ignores profile keys in a member crate's
# manifest - `unused manifest key`, then it builds as if the key were not there.
# An earlier version of this file had one, including a `target-cpu` that looked
# plausible and did nothing, and a measurement taken across the change was written
# down as its effect. The release settings are at the workspace root.
